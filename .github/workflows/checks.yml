name: Check website changes
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -X utf8 -m unittest discover -s scripts -p "test_*.py"
      - run: python -B -X utf8 scripts/build.py
      - run: python -B -X utf8 scripts/check.py
      - name: Verify committed pages and repeatable build
        run: |
          git diff --exit-code -- site/
          python -B -X utf8 scripts/build.py
          git diff --exit-code -- site/
